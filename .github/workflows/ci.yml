name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting (Pint)
        run: ./vendor/bin/pint --test

      - name: Run tests (Pest, sqlite in-memory)
        run: ./vendor/bin/pest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build assets
        run: npm run build

  postgres-migrations:
    name: Migrations on Postgres + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobscope
          POSTGRES_PASSWORD: jobscope
          POSTGRES_DB: jobscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Exercises the pgvector extension, the vector(1024) column, the generated
      # tsvector search_vector column, and the HNSW/GIN indexes — none of which
      # run on the sqlite test path above.
      - name: Run migrations against Postgres + pgvector
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: jobscope
          DB_USERNAME: jobscope
          DB_PASSWORD: jobscope
        run: php artisan migrate --force
