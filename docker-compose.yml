services:
  # ---------------------------------------------------------------------------
  # PHP-FPM application container
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
    image: job-ai-scraper:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Nginx web server
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Queue worker (job scraping runs here)
  # ---------------------------------------------------------------------------
  queue:
    image: job-ai-scraper:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=3
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Scheduler (runs Laravel's scheduled tasks every minute)
  # ---------------------------------------------------------------------------
  scheduler:
    image: job-ai-scraper:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app

  # ---------------------------------------------------------------------------
  # MySQL database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Redis (cache, sessions, queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_public:

networks:
  app:
    driver: bridge
