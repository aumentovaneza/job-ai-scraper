services:
  # ---------------------------------------------------------------------------
  # PHP-FPM application container
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
    image: job-ai-scraper:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Nginx web server
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Queue worker — Horizon supervises the Redis queues (job scraping runs here)
  # ---------------------------------------------------------------------------
  queue:
    image: job-ai-scraper:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan horizon
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Scheduler (runs Laravel's scheduled tasks every minute)
  # ---------------------------------------------------------------------------
  scheduler:
    image: job-ai-scraper:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app

  # ---------------------------------------------------------------------------
  # PostgreSQL database (pgvector: embeddings + native tsvector FTS)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Redis (cache, sessions, queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_public:

networks:
  app:
    driver: bridge
